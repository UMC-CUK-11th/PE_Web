spring:
  datasource:
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트 컨텍스트가 시작될 때 스키마를 생성하고 종료될 때 제거합니다.
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-secret-for-context-loading-only-not-for-production
  access-expiration: 3600

# H2와 JWT 설정은 테스트에서만 사용한다. MODE=MySQL은 일부 MySQL 문법을 호환한다.
