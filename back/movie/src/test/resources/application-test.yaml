spring:
  datasource:
    url: jdbc:h2:mem:movie;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MEMBER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
jwt:
  secret: movie-api-integration-test-signing-key-32-bytes-minimum
  access-expiration: 3600
