spring:
  application:
    name: umc-study
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/umc_week03?connectionTimeZone=Asia/Seoul}
    username: ${DB_USER:root}
    password: ${DB_PW:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
server:
  address: 127.0.0.1
  port: ${PORT:8084}
  error:
    include-message: always
