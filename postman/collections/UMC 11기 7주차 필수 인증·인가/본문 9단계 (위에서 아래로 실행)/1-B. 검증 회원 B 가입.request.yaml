$kind: http-request
url: "{{baseUrl}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "umc07b_{{stamp}}@example.com",
      "nickname": "B{{shortStamp}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('COMMON201', () => pm.expect(pm.response.json().code).to.eql('COMMON201'));
    language: text/javascript
order: 2000
