$kind: http-request
url: "{{baseUrl}}/ratings/999999999"
method: DELETE
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('RATING404_1', () => pm.expect(pm.response.json().code).to.eql('RATING404_1'));
    language: text/javascript
order: 10000
