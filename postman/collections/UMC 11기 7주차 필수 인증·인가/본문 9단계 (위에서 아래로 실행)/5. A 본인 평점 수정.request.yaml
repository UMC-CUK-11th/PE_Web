$kind: http-request
url: "{{baseUrl}}/ratings/{{ratingId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: |-
    {
      "score": 4,
      "comment": "수정한 후기"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('COMMON200', () => pm.expect(pm.response.json().code).to.eql('COMMON200'));
    language: text/javascript
order: 7000
