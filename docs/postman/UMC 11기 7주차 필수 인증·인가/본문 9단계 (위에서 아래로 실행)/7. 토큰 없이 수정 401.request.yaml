$kind: http-request
url: "{{baseUrl}}/ratings/{{ratingId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "score": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('AUTH401_2', () => pm.expect(pm.response.json().code).to.eql('AUTH401_2'));
    language: text/javascript
order: 9000
