$kind: http-request
url: "{{baseUrl}}/members/me"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: |-
    {
      "nickname": "변경{{shortStamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('COMMON200', () => pm.expect(pm.response.json().code).to.eql('COMMON200'));
    language: text/javascript
order: 3000
