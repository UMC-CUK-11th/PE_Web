$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "umc07a_{{stamp}}@example.com",
      "password": "wrong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('AUTH401_1', () => pm.expect(pm.response.json().code).to.eql('AUTH401_1'));
    language: text/javascript
order: 4000
