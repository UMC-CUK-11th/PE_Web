spring:
  application:
    name: movie
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/umc_movie?connectionTimeZone=Asia/Seoul}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: always
